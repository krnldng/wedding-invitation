# Build and deploy the `thao` branch (Văn Huy & Thu Thảo) to GitHub Pages:
# https://krnldng.github.io/wedding-invitation/

name: Deploy thao to GitHub Pages

on:
  push:
    branches: [ "thao" ]
  workflow_dispatch:

permissions:
  contents: read

# Only one Pages deployment at a time; a newer push cancels the queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'yarn'
    - run: yarn install --frozen-lockfile
    - run: yarn build:public
    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy GitHub Pages site
      id: deployment
      uses: actions/deploy-pages@v4
